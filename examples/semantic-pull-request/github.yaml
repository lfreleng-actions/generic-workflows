# =============================================================================
# EXAMPLE: caller for the reusable semantic pull request workflow
# =============================================================================
# Copy this file into your project's .github/workflows/ directory as
# semantic-pull-request.yaml and pin the `uses:` ref to a
# generic-workflows release SHA.
#
# This replaces the caller that pointed at
# lfit/releng-reusable-workflows/.github/workflows/
# reuse-semantic-pull-request.yaml. Keep the workflow file name, the
# job id and the job name exactly as they are below: a required status
# check is matched by name, and renaming any of them detaches the
# ruleset from the check it is meant to gate.
#
# DEPLOYMENT NOTES:
#   * Needs no secrets.
#   * `pull-requests: read` is not optional. The reusable reads the
#     pull request and its commits, a called workflow's token cannot
#     exceed its caller's, and repositories that default the token to
#     minimal permissions return 403 without it.
#   * No workflow_dispatch trigger. The underlying action infers the
#     pull request from the event payload and fails on any other event.
#   * If the organisation's mandatory-workflows ruleset already injects
#     a required 'Semantic Pull Request' workflow into your repository,
#     you do not need this caller at all, and adding it produces two
#     check runs of the same name. Adopt this caller only where no such
#     requirement applies, or once the injected copy has gone.
#   * There is no Gerrit variant of this caller. Gerrit projects review
#     changes in Gerrit; their GitHub mirror receives no pull requests
#     for this check to read.
# =============================================================================
name: 'Semantic Pull Request 🛠️'

# yamllint disable-line rule:truthy
on:
  pull_request:
    # 'edited' catches a title correction, 'synchronize' a push that
    # changes the commit count and therefore whether the single-commit
    # rules apply at all. Add 'labeled' and 'unlabeled' if you set the
    # ignore_labels input, so the check re-runs when a label changes.
    types: [opened, reopened, edited, synchronize]

permissions: {}

# A literal group, NOT '${{ github.workflow }}-${{ github.ref }}'.
# github.workflow resolves to the workflow NAME, so any other workflow
# in the repository carrying this same name would compute the same
# group and one of the two would be cancelled.
concurrency:
  group: 'semantic-pull-request-${{ github.ref }}'
  # Do NOT cancel, and queue rather than replace.
  #
  # Closely-spaced 'edited' and 'synchronize' events would otherwise
  # leave a cancelled check run beside a successful one for the same
  # head SHA. The merge box then reads "Some checks were not
  # successful", and where this is a required status check, ruleset
  # evaluation blocks on the cancelled run even though the check
  # passed.
  #
  # cancel-in-progress alone is not enough: the queue defaults to
  # 'single', which holds one pending run and cancels it when a third
  # event arrives. 'queue: max' holds up to 100 and runs them in
  # order. It cannot be combined with 'cancel-in-progress: true',
  # which is a validation error.
  #
  # The check takes seconds, so queueing costs little.
  cancel-in-progress: false
  queue: max

jobs:
  semantic-pull-request:
    name: 'Semantic Pull Request'
    permissions:
      contents: read
      pull-requests: read  # Read PR title and commits (avoids 403)
    # REPLACE the pinned SHA below with a generic-workflows release SHA.
    # The all-zero SHA is a non-functional placeholder, NOT a real commit.
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/generic-workflows/.github/workflows/semantic-pull-request.yaml@0000000000000000000000000000000000000000  # REPLACE: vX.Y.Z
    # All inputs are optional and default to the organisation's
    # Conventional Commits policy. Uncomment only what you need;
    # stripping the '# ' prefix leaves valid YAML at the right indent.
    # with:
    #   # Newline-separated; these are the defaults.
    #   types: |
    #     Fix
    #     Feat
    #     Chore
    #     Docs
    #     Style
    #     Refactor
    #     Perf
    #     Test
    #     Revert
    #     CI
    #     Build
    #   scopes: ''                 # newline-separated allow-list
    #   disallow_scopes: ''        # newline-separated deny-list
    #   require_scope: false
    #   subject_pattern: ''        # e.g. '^[A-Z].*[^.]$'
    #   subject_pattern_error: ''
    #   ignore_labels: ''          # e.g. 'ignore-semantic-pull-request'
    #   validate_single_commit: true
    #   validate_single_commit_matches_pr_title: true
    #   dependabot_relax: true     # false holds bots to an exact match
    #   runs_on: 'ubuntu-latest'   # Linux only
    #   timeout_minutes: 5
    #   harden_runner_egress: 'block'
