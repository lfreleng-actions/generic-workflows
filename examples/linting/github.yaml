# =============================================================================
# EXAMPLE: caller for the reusable standalone linting workflow
# =============================================================================
# Copy this file into your project's .github/workflows/ directory as
# linting.yaml and pin the `uses:` ref to a generic-workflows release
# SHA.
#
# With no inputs the reusable runs EVERY hook your repository's
# .pre-commit-config.yaml declares, in one job. That is the behaviour
# a project migrating from compose-repo-linting wants unchanged.
#
# Where pre-commit.ci already runs the rest, set 'ci_skipped: true' to
# run just the hooks it is told to skip -- the ones needing network
# access at scan time, or whose environments exceed its size limits --
# one parallel job each. Or name hooks explicitly with 'hooks'.
#
# When your repository has no configuration, the workflow falls back
# to linting/.pre-commit-config.yaml in your organisation's '.github'
# repository. When neither exists the run skips quickly and green, so
# this caller is safe to mandate estate-wide from an organisation
# ruleset without blocking merges on repositories with nothing to
# lint.
#
# DEPLOYMENT NOTES:
#   * Needs no secrets. The workflow token (read-only here) reaches
#     hooks that call the GitHub API, such as gha-workflow-linter,
#     on TRUSTED events alone: push, schedule, workflow_dispatch and
#     a same-repository pull request. Every other event withholds
#     it, because the checkout may carry hooks from outside the base
#     repository that could exfiltrate it. Set
#     export_github_token: false to withhold it everywhere.
#   * Trigger on 'pull_request', 'push', 'schedule' or
#     'workflow_dispatch'. The reusable REFUSES
#     'pull_request_target', which would run repository-defined tools
#     against fork code under an elevated token. Other events run,
#     but without the workflow token: see 'export_github_token'.
#   * The organisation fallback needs the org's '.github' repository
#     to be public; the workflow token cannot read a private sibling
#     repository.
#   * If the organisation's mandatory-workflows ruleset already
#     injects a required 'Linting 🧹' workflow into your repository,
#     you do not need this caller at all, and adding it produces two
#     check runs of the same name.
# =============================================================================
name: 'Linting 🧹'

# yamllint disable-line rule:truthy
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

# A literal group, NOT '${{ github.workflow }}-${{ github.ref }}':
# github.workflow resolves to the workflow NAME, so any other
# workflow carrying the same name would compute the same group and
# one of the two would be cancelled. Never cancel, and queue rather
# than replace, so a burst of events cannot leave a cancelled check
# run beside a successful one for the same head SHA (which blocks
# ruleset evaluation wherever the check is required).
concurrency:
  group: 'linting-${{ github.ref }}'
  cancel-in-progress: false
  queue: max

jobs:
  linting:
    name: 'Linting'
    permissions:
      contents: read
    # REPLACE the pinned SHA below with a generic-workflows release SHA.
    # The all-zero SHA is a non-functional placeholder, NOT a real commit.
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/generic-workflows/.github/workflows/linting.yaml@0000000000000000000000000000000000000000  # REPLACE: vX.Y.Z
    # All inputs are optional. With none, the workflow runs EVERY hook
    # in the repository's configuration, in one job -- the behaviour a
    # project migrating from compose-repo-linting wants unchanged.
    # Uncomment only what you need; stripping the '# ' prefix leaves
    # valid YAML at the right indent.
    # with:
    #   # Where pre-commit.ci already runs the rest, narrow to the
    #   # hooks it is told to skip (one parallel job each):
    #   ci_skipped: true
    #   # Run a named subset of the primary configuration instead:
    #   hooks: 'mypy gitlint'
    #   # Or the inverse -- everything EXCEPT these. This is the
    #   # equivalent of compose-repo-linting's pre_commit_skips, and
    #   # applies to every task including plan entries:
    #   skip_hooks: 'actionlint'
    #   # Or lint against an alternate/remote configuration:
    #   config_path: '.github/supplemental-linting.yaml'
    #   config_url: ''             # https:// only
    #   config_sha256: ''          # pin remote content (recommended)
    #   # Several independent tasks, fanned out in parallel.
    #   # Mutually exclusive with the scalar selectors above.
    #   plan: |
    #     [
    #       {"name": "ci-skip-defaults", "ci_skipped": true},
    #       {"name": "heavy", "hooks": "mypy"},
    #       {"name": "supplemental",
    #        "config_path": ".github/supplemental-linting.yaml"}
    #     ]
    #   path_prefix: '.'
    #   org_fallback: true
    #   org_config_path: 'linting/.pre-commit-config.yaml'
    #   split_hooks: true          # one job per SELECTED hook
    #   fail_fast: false
    #   branch_name: ''            # for no-commit-to-branch hooks
    #   export_github_token: true
    #   prek_version: '0.4.14'
    #   runs_on: 'ubuntu-latest'   # not ubuntu-slim: see docs/linting.md
    #   timeout_minutes: 15
    #   harden_runner_egress: 'audit'
