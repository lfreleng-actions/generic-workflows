---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

ci:
  autofix_prs: false
  # pre-commit.ci sandbox prevents network calls; disable gha-workflow-linter
  # and lint-plan-interpreter-fixtures, which also needs uv
  skip: [gha-workflow-linter, lint-plan-interpreter-fixtures]
  autofix_commit_msg: |
    Chore: pre-commit autofixes

    Signed-off-by: pre-commit-ci[bot] <pre-commit-ci@users.noreply.github.com>
  autoupdate_commit_msg: |
    Chore: pre-commit autoupdate

    Signed-off-by: pre-commit-ci[bot] <pre-commit-ci@users.noreply.github.com>

exclude: "^docs/conf.py"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-ast
      - id: check-json
      - id: check-merge-conflict
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: no-commit-to-branch
        args:
          - --branch=dev
          - --branch=master
          - --branch=main
          - --branch=rc
          - --branch=production

  - repo: https://github.com/jorisroovers/gitlint
    rev: acc9d9de6369b76d22cb4167029d2035e8730b98 # frozen: v0.19.1
    hooks:
      - id: gitlint

  - repo: https://github.com/adrienverge/yamllint.git
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        types: [yaml]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # frozen: v0.17.3
    hooks:
      - id: ruff
        files: ^(scripts|tests|custom_components)/.+\.py$
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        files: ^(scripts|tests|custom_components)/.+\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: ad26ebfa797fcb9b8f83275937c1c1d6e126719c  # frozen: v2.4.1
    hooks:
      - id: mypy

  - repo: https://github.com/btford/write-good
    rev: ab66ce10136dfad5146e69e70f82a3efac8842c1 # frozen: v1.0.8
    hooks:
      - id: write-good
        files: "\\.(rst|md|markdown|mdown|mkdn)$"

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: cbcdc463be5464e25e3e955a511599a67b9b987f  # frozen: v0.50.0
    hooks:
      - id: markdownlint
        args: ["--fix"]

  - repo: https://github.com/fsfe/reuse-tool
    rev: bffd9abdccdd86e7926c871a31564913547552c9  # frozen: v6.3.0
    hooks:
      - id: reuse

  # Replaces: https://github.com/rhysd/actionlint
  # Permits actionlint to run both locally and with precommit.ci/GitHub
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: 357f7eec6dec49bf7693dc0dbec30212226d5492  # frozen: v1.7.12.25
    hooks:
      - id: actionlint
        # Upstream scopes this to '^.github/workflows/'. Widened to add
        # the examples/ callers, which are real workflow files that
        # consumers copy verbatim and so earn the same linting as the
        # workflows they call. The upstream scope is preserved verbatim
        # as the first alternative.
        files: ^\.github/workflows/|^examples/.+\.ya?ml$

  # Static analysis for GitHub Actions security issues. Scoped to cover
  # examples/ as well as the upstream hook's own paths: a zizmor
  # *directory* scan collects only .github/workflows and
  # .github/dependabot.yml, so passing explicit paths (which pre-commit
  # does) is the only way to audit the examples. See .github/zizmor.yml
  # for the one ignore this requires.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
    hooks:
      - id: zizmor
        # Upstream pattern kept intact as the leading alternatives, so
        # .github/dependabot.yml and any action.yaml keep their
        # coverage; only the examples/ alternative is new.
        # yamllint disable-line rule:line-length
        files: (\.github/(workflows/.*|dependabot\.ya?ml))|(action\.ya?ml)$|^examples/.+\.ya?ml$
        # zizmor decides between offline and online audits by probing
        # for GH_TOKEN/GITHUB_TOKEN/ZIZMOR_GITHUB_TOKEN, so a developer
        # who exports one would silently run a different audit set from
        # tokenless CI. Pin the mode so the hook is deterministic
        # everywhere. '--no-progress' repeats the upstream default,
        # which supplying 'args' would otherwise replace.
        args: ['--no-progress', '--offline']

  # Check for misspellings in documentation files
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell

  # Requires a mirror, primary repo lacks .pre-commit-hooks.yaml
  - repo: https://github.com/DetachHead/basedpyright-prek-mirror
    rev: a11caebebdbf797e1e96611123db279b334a7675  # frozen: 1.40.2
    hooks:
      - id: basedpyright

  - repo: https://github.com/lfreleng-actions/gha-workflow-linter
    rev: 00aec232d3fd85436fff24dfeaad23921c5db1cb  # frozen: v1.10.1
    hooks:
      - id: gha-workflow-linter

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 39478bf2c099a58683d3f1aedf675105318b078d  # frozen: 0.39.0
    hooks:
      - id: check-github-actions
      - id: check-github-workflows
      # Same schema, applied to the example callers, which live outside
      # the hook's default .github/workflows scope.
      - id: check-github-workflows
        name: Validate GitHub Workflows (examples)
        files: ^examples/.+\.ya?ml$
      - id: check-jsonschema
        name: Check GitHub Workflows set timeout-minutes
        args:
          - --builtin-schema
          - github-workflows-require-timeout
        files: ^(\.github/workflows/[^/]+|examples/.+)\.ya?ml$
        types:
          - yaml
      - id: check-readthedocs

  # Fixtures for the shell decision rules in the locate step: the
  # dangling-symlink walk and the organisation-fallback status
  # mapping. Both decide whether linting runs at all, and neither is
  # reachable from the Python resolver suite above.
  - repo: local
    hooks:
      - id: locate-rules-fixtures
        name: Locate rule fixtures
        entry: tests/test-locate-rules.sh
        language: script
        pass_filenames: false
        # yamllint disable-line rule:line-length
        files: '^(\.github/workflows/linting\.yaml|tests/test-locate-rules\.sh)$'

  # Fixtures for the Dependabot single-commit title exception. The test
  # extracts the rule from the workflow, so it runs whenever either the
  # workflow or the fixtures change.
  - repo: local
    hooks:
      - id: relax-matches-fixtures
        name: Semantic PR title exception fixtures
        entry: tests/test-relax-matches.sh
        language: script
        pass_filenames: false
        # yamllint disable-line rule:line-length
        files: '^(\.github/workflows/semantic-pull-request\.yaml|tests/test-relax-matches\.sh)$'

  # Fixtures for the opt-in breaking-change marker check, extracted
  # from the same workflow. 'language: system' with an explicit bash,
  # so the fixture file needs no executable bit.
  - repo: local
    hooks:
      - id: breaking-marker-fixtures
        name: Semantic PR breaking-change marker fixtures
        entry: bash tests/test-breaking-marker.sh
        language: system
        pass_filenames: false
        # yamllint disable-line rule:line-length
        files: '^(\.github/workflows/semantic-pull-request\.yaml|tests/test-breaking-marker\.sh)$'

  # Fixtures for the lint plan resolver. The test extracts the resolver
  # from the workflow, so it runs whenever either the workflow or the
  # fixtures change. A 'language: python' hook rather than 'script':
  # the resolver needs PyYAML, and pre-commit.ci's sandbox has neither
  # uv nor the network to fetch one, so the environment must supply it.
  - repo: local
    hooks:
      - id: lint-plan-fixtures
        name: Lint plan resolver fixtures
        entry: tests/test-lint-plan.sh
        language: python
        additional_dependencies: ['pyyaml==6.0.2']
        pass_filenames: false
        # The suite reads this repository's own configuration as its
        # default fixture and asserts hook ids from it, so renaming
        # or removing a hook here can invalidate the fixtures. Listed
        # so that editing it runs them.
        # yamllint disable-line rule:line-length
        files: '^(\.github/workflows/linting\.yaml|tests/test-lint-plan\.sh|\.pre-commit-config\.yaml)$'

  # Fixtures for the interpreter the lint plan resolver runs under:
  # the step runs beside a planted '.venv/', '.python-version' and
  # 'uv.toml', and must not execute them. What it tests is uv's own
  # choice of interpreter, so it needs uv on PATH, and 'language:
  # system' with an explicit bash so the file needs no executable bit.
  - repo: local
    hooks:
      - id: lint-plan-interpreter-fixtures
        name: Lint plan resolver interpreter fixtures
        entry: bash tests/test-lint-plan-interpreter.sh
        language: system
        pass_filenames: false
        # yamllint disable-line rule:line-length
        files: '^(\.github/workflows/linting\.yaml|tests/test-lint-plan-interpreter\.sh)$'

  # Fixtures for the change isolation plan and report, and for the
  # Gerrit examples' concurrency. The test extracts both scripts from
  # the workflow and reads the examples, so it runs whenever any of
  # them or the fixtures change. 'language: system' with an explicit
  # bash: the scripts need only git and python3, which every runner
  # of these hooks has.
  - repo: local
    hooks:
      - id: change-isolation-fixtures
        name: Change isolation plan and report fixtures
        entry: bash tests/test-change-isolation-plan.sh
        language: system
        pass_filenames: false
        # yamllint disable-line rule:line-length
        files: '^(\.github/workflows/change-isolation\.yaml|examples/change-isolation/gerrit(-info-yaml-only)?\.yaml|tests/test-change-isolation-plan\.sh)$'

  # Fixtures for the tox verify Gerrit and plan scripts, and for the
  # Gerrit example's concurrency. The test extracts both scripts from
  # the workflow, compares the Gerrit script with
  # change-isolation.yaml's and reads the example, so it runs
  # whenever either workflow, the example or the fixtures change.
  # 'language: system' with an explicit bash, as for the change
  # isolation fixtures above.
  - repo: local
    hooks:
      - id: tox-verify-fixtures
        name: Tox verify plan fixtures
        entry: bash tests/test-tox-verify-plan.sh
        language: system
        pass_filenames: false
        # yamllint disable-line rule:line-length
        files: '^(\.github/workflows/(tox-verify|change-isolation)\.yaml|examples/tox-verify/gerrit-tox-verify\.yaml|tests/test-tox-verify-plan\.sh)$'

  # Fixtures for the ci-management verify Gerrit, plan and
  # credential-removal scripts. The test extracts them from the
  # workflow, compares the Gerrit script with change-isolation.yaml's
  # and the credential removal with tox-verify.yaml's, holds
  # linting-verify.yaml's copies of both to the same, and its
  # harden-runner check to linting.yaml's, and reads the Gerrit
  # example's concurrency, so it runs whenever any of the five
  # workflows, the example or the fixtures change.
  # 'language: system' with an explicit bash, as for the tox verify
  # fixtures above.
  - repo: local
    hooks:
      - id: ci-management-verify-fixtures
        name: CI management verify plan fixtures
        entry: bash tests/test-ci-management-verify-plan.sh
        language: system
        pass_filenames: false
        # yamllint disable-line rule:line-length
        files: '^(\.github/workflows/(ci-management-verify|linting(-verify)?|tox-verify|change-isolation)\.yaml|examples/ci-management/gerrit-ci-management-verify\.yaml|tests/test-ci-management-verify-plan\.sh)$'

  # Fixtures for the linting verify Gerrit, plan and harden-runner
  # scripts, for the example caller's vote rule, and for linting.yaml's
  # refusal of a per-patchset Gerrit dispatch. The test extracts them
  # from the workflows and the example, so it runs whenever any of
  # them or the fixtures change. 'language: system' with an explicit
  # bash, as for the ci-management verify fixtures above.
  - repo: local
    hooks:
      - id: linting-verify-fixtures
        name: Linting verify plan fixtures
        entry: bash tests/test-linting-verify-plan.sh
        language: system
        pass_filenames: false
        # yamllint disable-line rule:line-length
        files: '^(\.github/workflows/linting(-verify)?\.yaml|examples/linting-verify/gerrit-linting-verify\.yaml|tests/test-linting-verify-plan\.sh)$'

  # Fixtures for the ci-management merge plan and merged-revision
  # wait. The test extracts both from the workflow, so it runs
  # whenever the workflow or the fixtures change. 'language: system'
  # with an explicit bash, as for the verify fixtures above.
  - repo: local
    hooks:
      - id: ci-management-merge-fixtures
        name: CI management merge plan fixtures
        entry: bash tests/test-ci-management-merge-plan.sh
        language: system
        pass_filenames: false
        # yamllint disable-line rule:line-length
        files: '^(\.github/workflows/ci-management-merge\.yaml|tests/test-ci-management-merge-plan\.sh)$'

  # Drift check for the harden-runner allow-list inputs: every reusable
  # workflow using harden-runner-block-action exposes the same five
  # harden_runner_* inputs and passes each through, and every
  # block-action step in any workflow pins one release. 'language: python'
  # for PyYAML, with an explicit bash so the file needs no executable
  # bit.
  - repo: local
    hooks:
      - id: harden-runner-inputs
        name: Harden-runner allow-list input drift check
        entry: bash tests/test-harden-runner-inputs.sh
        language: python
        additional_dependencies: ['pyyaml==6.0.2']
        pass_filenames: false
        # yamllint disable-line rule:line-length
        files: '^(\.github/workflows/[^/]+\.yaml|tests/test-harden-runner-inputs\.sh)$'
