# Fixture for the Python 3.10 legs of
# .github/workflows/tox-verify-action.yaml. tox-run-action runs tox on
# Python 3.11 or newer, so these legs ask for 3.10 and expect tox on
# 3.13 with TOX_OVERRIDE pointing unfactored environments at 3.10.
# 'fixture' has no Python factor, so only the override keeps it on
# 3.10; 'py310' finds python3.10 on PATH by its factor. Each fails
# unless it ran where the leg expects. python-version.txt serves the leg
# that names it through python_version_file.

[tox]
envlist = fixture, py310
no_package = true

[testenv]
skip_install = true
pass_env =
    pythonLocation
    TOX_OVERRIDE
commands =
    python {toxinidir}{/}..{/}record_python.py 3.10 3.13 \
        testenv.default_base_python=python3.10

[testenv:fixture]
description = Prove an environment without a Python factor runs on 3.10

[testenv:py310]
description = Prove a factor environment runs on 3.10
