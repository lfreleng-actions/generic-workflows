# Fixture for the Python 3.11 legs of
# .github/workflows/tox-verify-action.yaml. 3.11 is the organisation's
# minimum Python and the oldest tox-run-action runs tox on, so these
# legs ask for 3.11 and expect tox and every environment on 3.11 with
# no TOX_OVERRIDE. 'fixture' has no Python factor; 'py311' finds
# python3.11 on PATH by its factor. Each fails unless it ran where the
# leg expects. python-version.txt serves the leg that names it through
# python_version_file.

[tox]
envlist = fixture, py311
no_package = true

[testenv]
skip_install = true
pass_env =
    pythonLocation
    TOX_OVERRIDE
commands =
    python {toxinidir}{/}..{/}record_python.py 3.11 3.11

[testenv:fixture]
description = Prove an environment without a Python factor runs on 3.11

[testenv:py311]
description = Prove a factor environment runs on 3.11
