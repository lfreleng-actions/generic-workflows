# Fixture for .github/workflows/tox-verify-action.yaml. Neither
# environment installs a package or a dependency, so a run needs no
# host beyond those tox and pip already reach (PyPI), which the
# organisation allow-list carries. The leg asks for Python 3.12, which
# runs tox itself, so 'python' fails unless tox and the environment
# both ran on 3.12 and no TOX_OVERRIDE was set.

[tox]
envlist = fixture, python
no_package = true

[testenv]
skip_install = true

[testenv:fixture]
description = Prove tox runs in the tox-verify matrix leg
commands =
    python -c "print('tox-verify fixture ran')"

[testenv:python]
description = Prove a 3.12 leg runs tox and the env on 3.12, no override
pass_env =
    pythonLocation
    TOX_OVERRIDE
commands =
    python {toxinidir}{/}..{/}tox-python{/}record_python.py 3.12 3.12
