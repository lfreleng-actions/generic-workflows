# Configuration for zizmor (https://docs.zizmor.sh).
#
# The pre-commit hook deliberately widens zizmor's file scope to cover
# examples/ as well as .github/workflows. The example callers are real
# workflow files that consumers copy verbatim, so they warrant the same
# audit as the workflows they call. Note that a zizmor *directory* scan
# collects only .github/workflows and .github/dependabot.yml and never
# descends into examples/, so passing explicit paths -- which pre-commit
# does -- is the only way to audit them.

rules:
  impostor-commit:
    ignore:
      # The example callers pin an all-zero placeholder SHA. It cannot
      # resolve, by design: it fails loudly and forces the reader to
      # substitute a real release SHA rather than track a mutable ref.
      # zizmor reports it as an impostor commit -- accurate, but not
      # actionable here.

      # Scoped to the exact placeholder LINES, not whole files. These
      # examples pin no other actions today, so a file-wide ignore would
      # cost nothing yet; line scoping keeps the exemption correct once
      # one is added, and matches the sibling repositories where it
      # already would hide a genuine impostor commit.

      # An ignore rule takes no path, only a base filename, so each entry
      # applies to that line in every example sharing the name. Verified
      # that no entry below lands on a different 'uses:' line in a
      # same-named file.

      # Line numbers make these brittle, which is the safer failure
      # mode: editing an example above a placeholder shifts the line,
      # the entry stops matching, and the finding reappears. That fails
      # loudly and is fixed by correcting the number, where a file-wide
      # ignore fails silently.

      # Inert under the pre-commit hook, which pins zizmor to --offline;
      # impostor-commit needs the GitHub API and does not run in that
      # mode. These apply to online runs -- a developer invoking zizmor
      # with a token, or a future CI lane.

      # Configured here rather than as inline 'zizmor: ignore' comments
      # on purpose. Consumers copy these files wholesale, and an inline
      # suppression would travel with them, masking a genuine finding in
      # their repository once they replace the placeholder.
      - gerrit.yaml:51
      - github.yaml:46
      - github.yaml:59
      - github.yaml:78
      - github.yaml:83
      - github.yaml:96

  stale-action-refs:
    ignore:
      # The same placeholder lines, for the same reason. This audit
      # reports that a pinned SHA does not point to a Git tag, which
      # is true of an all-zero placeholder and cannot be otherwise:
      # the whole point is a reference that fails loudly until a
      # reader substitutes a real release SHA.
      #
      # zizmor documents it as a '--pedantic only' audit because the
      # situation is not a vulnerability, and it is the same lines
      # impostor-commit already exempts above -- so exempting it here
      # keeps one decision about these placeholders rather than two.
      #
      # Line-scoped and brittle by the same design: editing an
      # example above a placeholder shifts the line, the entry stops
      # matching, and the finding reappears rather than a file-wide
      # ignore hiding a real one.
      - gerrit.yaml:51
      - github.yaml:46
      - github.yaml:59
      - github.yaml:78
      - github.yaml:83
      - github.yaml:96
