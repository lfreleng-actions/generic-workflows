# =============================================================================
# Thin linting caller
# =============================================================================
# This repository consumes its own reusable workflow, so every pull
# request raised here exercises the code shipped to consumers: a
# regression in linting.yaml turns this repository's own check red
# instead of surfacing first in a downstream project.
#
# The reusable is referenced with the self-repository form ('$/'),
# which resolves this repository at the commit already running, so the
# branch's own copy runs and no self-pin is needed. Consumers pin a
# released SHA instead, as examples/linting/github.yaml shows.
#
# The '-action' suffix is a local disambiguator: a caller in this
# repository cannot share a file name with the reusable it calls.
# Consuming repositories name the file linting.yaml.
#
# The workflow name, job name and concurrency group carry a '(self)'
# marker, which consuming repositories should NOT copy: two workflows
# sharing a name share a concurrency group, because github.workflow
# resolves to the NAME, so an unmarked caller here would collide with
# an organisation-injected workflow of the same name.
#
# Three jobs, each exercising ONE selection mode. Two name hooks
# explicitly and take the configuration through primary discovery;
# the third names a small fixture configuration and runs every hook
# in it, which is the run-all task shape. Adopting the no-input
# default against this repository's real configuration would lint
# the whole tree twice on every push, since pre-commit.ci already
# does it on the same pull request. See the job comments below.
# =============================================================================
name: 'Linting (self) 🧹'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

# A literal group rather than '${{ github.workflow }}-…', so a
# workflow elsewhere that happens to share this one's name cannot
# collide with it. Never cancel, and queue rather than replace: a
# cancelled check run sitting beside a successful one for the same
# head SHA muddies the merge box, and blocks ruleset evaluation
# wherever the check is a required one. 'queue: max' covers a burst,
# because the default 'single' queue cancels the pending run when a
# third event arrives.
concurrency:
  group: 'linting-self-${{ github.ref }}'
  cancel-in-progress: false
  queue: max

jobs:
  # Three narrow jobs rather than one on the defaults, deliberately.
  #
  # The reusable's default runs EVERY hook in the configuration, and
  # pre-commit.ci already runs all of them for this repository on the
  # same pull request. Adopting that default here against the
  # repository's own configuration would lint the whole tree twice on
  # every push for no added signal, which is the duplicated work the
  # ci_skipped input exists to let a caller avoid.
  #
  # So each job exercises one selection mode against a cheap target,
  # and between them they cover the three paths a consumer picks from.
  linting-ci-skipped:
    name: 'Linting (self, ci.skip)'
    permissions:
      contents: read
    uses: $/.github/workflows/linting.yaml
    with:
      # The hooks pre-commit.ci is told to skip, so the ones nothing
      # else covers. One hook today: gha-workflow-linter.
      ci_skipped: true

  linting-explicit:
    name: 'Linting (self, explicit)'
    permissions:
      contents: read
    uses: $/.github/workflows/linting.yaml
    with:
      # An explicit selection, which is how the organisation intends
      # to call this: aislop already runs as its own blocking
      # workflow, so naming hooks avoids scanning twice.
      hooks: 'gha-workflow-linter'

  linting-run-all:
    name: 'Linting (self, run-all)'
    permissions:
      contents: read
    uses: $/.github/workflows/linting.yaml
    with:
      # The RUN-ALL task shape -- every hook in the configuration --
      # which the two jobs above never reach, since both resolve to a
      # non-empty matrix.hooks. That leaves the expression
      # 'run_all_hooks: matrix.hooks == ...' and the action
      # invocation behind it covered by fixtures that only inspect
      # the JSON the expression reads.
      #
      # Reached through config_path, so this exercises the
      # NAMED-CONFIGURATION branch rather than primary discovery. The
      # two jobs above cover discovery, since neither names a
      # configuration; what none of the three covers is discovery and
      # run-all together. Putting the fixture at a discoverable
      # '.pre-commit-config.yaml' would close that, at the cost of
      # prek's workspace mode finding it during this repository's own
      # runs.
      config_path: 'tests/resources/minimal-lint-config.yaml'
      # Also the only end-to-end cover for skip_hooks forwarding.
      # That input travels from here, through the plan job, to the
      # executor step, and no resolver fixture can reach it: the
      # resolver never reads it, and the executor applies it.
      #
      # The fixture's second hook always fails, so this job passes
      # only while the forwarding works -- drop it and the excluded
      # hook runs.
      skip_hooks: 'run-all-must-be-skipped'
