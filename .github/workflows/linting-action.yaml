---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# =============================================================================
# Thin linting caller
# =============================================================================
# This repository consumes its own reusable workflow, so every pull
# request raised here exercises the code shipped to consumers: a
# regression in linting.yaml turns this repository's own check red
# instead of surfacing first in a downstream project.
#
# The reusable is referenced with the self-repository form ('$/'),
# which resolves this repository at the commit already running, so the
# branch's own copy runs and no self-pin is needed. Consumers pin a
# released SHA instead, as examples/linting/github.yaml shows.
#
# The '-action' suffix is a local disambiguator: a caller in this
# repository cannot share a file name with the reusable it calls.
# Consuming repositories name the file linting.yaml.
#
# The workflow name, job name and concurrency group carry a '(self)'
# marker, which consuming repositories should NOT copy: two workflows
# sharing a name share a concurrency group, because github.workflow
# resolves to the NAME, so an unmarked caller here would collide with
# an organisation-injected workflow of the same name.
#
# Seven jobs. The first three each exercise ONE selection mode: two
# name hooks explicitly and take the configuration through primary
# discovery; the third names a small fixture configuration and runs
# every hook in it, which is the run-all task shape. The next two run
# fixture projects through the project-toolchain preparation, one for
# Rust and one for Node.js. The last pair takes a fixture through
# config_url under the 'block' egress policy, then checks that the
# URL's query string never reached the reusable's matrix output.
# Adopting the no-input default against this repository's real
# configuration would lint the whole tree twice on every push, since
# pre-commit.ci already does it on the same pull request. See the job
# comments below.
#
# The ci.skip and config_url jobs also run under the 'block' egress
# policy with the organisation allow-list, which proves blocking
# works for the workflow's own traffic and for the artifact hand-over.
# =============================================================================
name: 'Linting (self) 🧹'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

# A literal group rather than '${{ github.workflow }}-…', so a
# workflow elsewhere that happens to share this one's name cannot
# collide with it. Never cancel, and queue rather than replace: a
# cancelled check run sitting beside a successful one for the same
# head SHA muddies the merge box, and blocks ruleset evaluation
# wherever the check is a required one. 'queue: max' covers a burst,
# because the default 'single' queue cancels the pending run when a
# third event arrives.
concurrency:
  group: 'linting-self-${{ github.ref }}'
  cancel-in-progress: false
  queue: max

jobs:
  # Three narrow jobs rather than one on the defaults, deliberately.
  #
  # The reusable's default runs EVERY hook in the configuration, and
  # pre-commit.ci already runs all of them for this repository on the
  # same pull request. Adopting that default here against the
  # repository's own configuration would lint the whole tree twice on
  # every push for no added signal, which is the duplicated work the
  # ci_skipped input exists to let a caller avoid.
  #
  # So each job exercises one selection mode against a cheap target,
  # and between them they cover the three paths a consumer picks from.
  linting-ci-skipped:
    name: 'Linting (self, ci.skip)'
    permissions:
      contents: read
    uses: $/.github/workflows/linting.yaml
    with:
      # The hooks pre-commit.ci is told to skip, so the ones nothing
      # else covers. One hook today: gha-workflow-linter.
      ci_skipped: true
      # If the organisation allow-list lacks a host the workflow
      # itself needs, this job fails, before any consumer that opted
      # into blocking does.
      harden_runner_egress: 'block'

  linting-explicit:
    name: 'Linting (self, explicit)'
    permissions:
      contents: read
    uses: $/.github/workflows/linting.yaml
    with:
      # An explicit selection, which is how the organisation intends
      # to call this: aislop already runs as its own blocking
      # workflow, so naming hooks avoids scanning twice.
      hooks: 'gha-workflow-linter'

  linting-run-all:
    name: 'Linting (self, run-all)'
    permissions:
      contents: read
    uses: $/.github/workflows/linting.yaml
    with:
      # The RUN-ALL task shape -- every hook in the configuration --
      # which the two jobs above never reach, since both resolve to a
      # non-empty matrix.hooks. That leaves the expression
      # 'run_all_hooks: matrix.hooks == ...' and the action
      # invocation behind it covered by fixtures that only inspect
      # the JSON the expression reads.
      #
      # Reached through config_path, so this exercises the
      # NAMED-CONFIGURATION branch rather than primary discovery. The
      # two jobs above cover discovery, since neither names a
      # configuration; what none of the three covers is discovery and
      # run-all together. Putting the fixture at a discoverable
      # '.pre-commit-config.yaml' would close that, at the cost of
      # prek's workspace mode finding it during this repository's own
      # runs.
      config_path: 'tests/resources/minimal-lint-config.yaml'
      # Also the only end-to-end cover for skip_hooks forwarding.
      # That input travels from here, through the plan job, to the
      # executor step, and no resolver fixture can reach it: the
      # resolver never reads it, and the executor applies it.
      #
      # The fixture's second hook always fails, so this job passes
      # only while the forwarding works -- drop it and the excluded
      # hook runs.
      skip_hooks: 'run-all-must-be-skipped'

  # The project-toolchain path, end to end, once per language. Each
  # points path_prefix at a fixture project and runs its fixture
  # configuration's ci.skip set -- the shape a real Rust or Node.js
  # repository uses, since pre-commit.ci cannot prepare either -- with
  # every toolchain input left at its default.
  #
  # The hooks pass only when preparation happened: the Rust crate
  # pins a toolchain the runner lacks, with no rustfmt or clippy, and
  # the Node.js hook refuses to download prettier. So a regression
  # that dropped or miswired the forwarded inputs fails these jobs
  # rather than letting the hooks find a toolchain by accident.
  #
  # A side effect worth knowing: the executor finds a Rust project by
  # a tracked Cargo.toml anywhere under path_prefix, so the three jobs
  # above (prefix '.') now also prepare the runner's default stable
  # toolchain. That toolchain and its components are preinstalled, so
  # the cost is a rustup check rather than a download.
  linting-rust-toolchain:
    name: 'Linting (self, Rust toolchain)'
    permissions:
      contents: read
    uses: $/.github/workflows/linting.yaml
    with:
      ci_skipped: true
      config_path: 'tests/resources/rust-toolchain-lint-config.yaml'
      path_prefix: 'tests/fixtures/rust'

  linting-node-toolchain:
    name: 'Linting (self, Node.js toolchain)'
    permissions:
      contents: read
    uses: $/.github/workflows/linting.yaml
    with:
      ci_skipped: true
      config_path: 'tests/resources/node-toolchain-lint-config.yaml'
      path_prefix: 'tests/fixtures/node'

  # The config_url route, end to end: the plan job fetches the
  # fixture, hands the bytes over as an artifact, and the lint job
  # runs them without contacting the host. Under 'block' egress, so
  # the artifact transfer is proven to fit the organisation
  # allow-list. The head repository and SHA, because a pull request
  # from a fork serves its fixture from the fork.
  #
  # The query string stands in for a presigned URL's signature; the
  # job below fails if it reaches the matrix output.
  linting-url:
    name: 'Linting (self, config_url)'
    permissions:
      contents: read
    uses: $/.github/workflows/linting.yaml
    with:
      # yamllint disable-line rule:line-length
      config_url: ${{ format('https://raw.githubusercontent.com/{0}/{1}/tests/resources/minimal-lint-config.yaml?selftest-signature=issue-52', github.event.pull_request.head.repo.full_name || github.repository, github.event.pull_request.head.sha || github.sha) }}
      skip_hooks: 'run-all-must-be-skipped'
      harden_runner_egress: 'block'

  linting-url-output-check:
    name: 'Linting (self, config_url output)'
    needs: linting-url
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@51ef68401547a8b648275129b9a21544612596d5  # v0.13.1
        with:
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@56d70f0eae78f334a598d1ffe071d4b821517b22'  # v0.17.1
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Check the matrix output carries no query string'
        env:
          MATRIX: ${{ needs.linting-url.outputs.matrix }}
        run: |
          # Check the matrix output carries no query string
          set -euo pipefail
          # An empty matrix would pass the query check vacuously.
          if [ -z "$MATRIX" ]; then
            echo '::error::the config_url matrix output is empty ❌'
            exit 1
          fi
          if ! printf '%s' "$MATRIX" | grep -qF '"kind":"url"'; then
            echo '::error::the matrix holds no url task ❌'
            exit 1
          fi
          if printf '%s' "$MATRIX" | grep -qF 'selftest-signature'; then
            echo "::error::the config_url query reached the" \
              "reusable workflow's matrix output ❌"
            exit 1
          fi
          echo 'The matrix output carries no query string ✅'
