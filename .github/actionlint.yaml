# Path-specific configurations.
paths:
  .github/workflows/semantic-pull-request-action.yaml:
    ignore:
      # actionlint does not yet know the 'queue' concurrency key.
      #
      # GitHub documents it under 'concurrency' and
      # 'jobs.<job_id>.concurrency': 'single' (the default) holds one
      # pending run and cancels it when another arrives, while 'max'
      # holds up to 100 and runs them in order. This caller needs
      # 'max' so a burst of pull request events cannot leave a
      # cancelled check run behind. See the comment on the
      # concurrency block in that file, and docs/semantic-pull-request.md.
      #
      # actionlint validates the key against a hardcoded list
      # (cancel-in-progress, group), so it reports the key as
      # unexpected. Remove this ignore once actionlint learns it.
      - 'unexpected key "queue" for "concurrency" section'
